[project]
name = "cutmind"
version = "0.1.0"
description = "Conversation-driven video editor skill for Codex and Claude Code"
# Capped below 3.14: torch publishes no cp314 wheels, which silently broke BOTH
# torch-backed extras (matting, whisperx) for anyone whose uv picked 3.14. The
# base install works fine on 3.14 — the cap exists so the extras stay installable.
requires-python = ">=3.10,<3.14"
dependencies = [
    "requests",
    "pillow",
    "numpy; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Face/eye tracking for the Phase-2 dynamic camera (face_track.py). Pinned:
    # opencv-python-headless 5.0.0.93 ships without CascadeClassifier and breaks
    # Haar detection — stay on the 4.10 line. Headless = no GUI/Qt deps.
    "opencv-python-headless==4.10.0.84",
    # Transcription with forced alignment (transcribe.py). A BASE dependency on
    # purpose: the skill must work with nothing to sign up for and no second
    # thing to install. It pulls torch + faster-whisper (~2GB of wheels), and
    # downloads a Whisper model plus a per-language wav2vec2 alignment model on
    # first run. That weight is the price of a keyless install.
    "whisperx; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Editing from a URL (ingest_url.py). A dependency and not a system package
    # on purpose: as an "optional" brew/winget install nobody had it, so the
    # feature looked broken to anyone who pasted a link. In the venv it is always
    # there, on every OS, and `uv run` puts .venv/bin first on PATH so the helper
    # that shells out to `yt-dlp` finds it.
    "yt-dlp",
    # QR code do "abrir no celular" (preview_server.py). Python puro, sem
    # biblioteca nativa: no Windows nada de DLL para instalar à parte.
    "segno>=1.6",
    # Melhorar voz (melhorar_voz.py): o Sidon roda pelo ONNX e o extrator de
    # características dele vem do transformers. Os dois já chegam pelo whisperx;
    # ficam aqui porque o kit os importa direto. Os modelos (~1 GB) baixam no
    # primeiro uso, não na instalação.
    "onnxruntime; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Grade de batida da música (batida.py), para cortar na batida e para o Modelo
    # de montagem. Roda no CPU sobre o torch que o whisperx já traz e acrescenta só
    # pacotes pequenos (einops, rotary-embedding-torch, soxr); o modelo (8 MB o
    # pequeno, 78 MB o completo) baixa no primeiro uso. MIT no código e nos pesos.
    "beat-this>=1.1.0",
    # Mac Intel (x86_64): o PyTorch publicou a última roda Intel na 2.2.2 e o
    # onnxruntime na 1.19.2, e as duas não têm roda para Python 3.13. Ali o kit
    # fica numa pilha anterior que ainda instala: whisperx 3.3.2 (a última que
    # aceita torch 2.2), numpy 1.x (o torch 2.2 foi compilado contra ele) e
    # Python 3.12, que o instalador pede ao uv sync só nessa máquina. Os
    # marcadores mantêm Windows, Linux e Mac Apple Silicon exatamente como eram.
    "whisperx==3.3.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # transformers 4.52+ recusa o torch.load com torch abaixo de 2.6 (CVE-2025-32434), e o
    # alinhador de português só existe em .bin: no Mac Intel o alinhamento sumia em silêncio.
    "transformers<4.52; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
animations = ["manim"]
# Person matting for the "element behind the subject" effect (person_matte.py).
# Robust Video Matting via torch.hub — heavy (~2GB), so it's opt-in: install with
# `uv sync --extra matting`. Base install stays light for users who don't need it.
matting = ["torch", "torchvision"]

# The one-command installer: `uvx --from git+<repo> cutmind-install`, or plain
# `uvx cutmind-install` once this is on PyPI. Stdlib-only, so it runs before any
# dependency exists — see cutmind_install.py.
[project.scripts]
cutmind-install = "cutmind_install:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cutmind_install"]
