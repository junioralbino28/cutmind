<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>CENNO Edit</title>
<link rel="icon" href="/assets/cenno-logo.png">
<!-- "Adicionar à tela inicial". A documentação do Chrome pede endereço seguro
     (https, ou 127.0.0.1 pelo cabo com adb reverse) para abrir como app, sem a
     barra do navegador; pelo Wi-Fi em http pode virar um atalho comum. -->
<link rel="manifest" href="/assets/celular.webmanifest">
<link rel="apple-touch-icon" href="/assets/icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- As mesmas faces do editor de PC: as amostras de legenda e headline usam
     exatamente estas (Poppins 900 itálica, Playfair 900 itálica, Lora, Baskerville). -->
<!-- Montserrat e Instrument Serif: a tipografia da marca CENNO, na interface. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&family=Playfair+Display:ital,wght@1,900&family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Libre+Baskerville:wght@700&family=Inter:wght@500&family=Montserrat:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/celular.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand"><img src="/assets/cenno-logo-white.png" alt="CENNO Edit"></div>
    <!-- o que está na prévia: o corte (para aprovar) ou o vídeo final -->
    <button class="mode" id="btnMode" type="button" aria-label="Trocar entre o corte e o vídeo final">
      <span id="modeLabel">Corte</span><span class="mode-sub" id="projectSub">carregando…</span><span class="mode-car" id="modeCar"></span>
    </button>
    <div class="t-spacer"></div>
    <span class="pill sent hidden" id="sentPill">enviado</span>
    <!-- um botão principal no canto de cima: Salvar quando há ajuste, Baixar quando não há -->
    <button class="tb-btn primary hidden" id="btnSave" type="button">Salvar <b id="dirtyCount">0</b></button>
    <button class="tb-btn primary hidden" id="btnDownload" type="button"><span class="tb-ico" id="downloadIco"></span>Baixar</button>
  </header>

  <section class="stage" id="stage">
    <!-- .comp: a mesma composição dos cartões do Estilo (faixa, janela do vídeo, headline, legenda) -->
    <div class="player comp" id="player">
      <div class="win"><video class="media" id="video" playsinline webkit-playsinline preload="auto"></video></div>
      <div class="band" id="ovBand"></div>
      <div class="hl" id="ovHl"></div>
      <div class="cap" id="ovCap"></div>
      <!-- ao aparar: o quadro do vídeo de ORIGEM na alça (o corte não tem o que foi cortado) -->
      <img class="peek hidden" id="peek" alt="">
      <button class="tap-play" id="tapPlay" type="button" aria-label="Reproduzir ou pausar"></button>
    </div>
  </section>

  <!-- linha do play: tela cheia e som à esquerda, play no centro, desfazer e refazer à direita -->
  <section class="transport" id="transport">
    <div class="t-side">
      <button class="t-ico" id="btnFull" type="button" aria-label="Tela cheia"></button>
      <button class="t-ico" id="btnMute" type="button" aria-label="Som"></button>
    </div>
    <button class="t-play" id="btnPlay" type="button" aria-label="Reproduzir"></button>
    <div class="t-side right">
      <button class="t-ico" id="btnUndo" type="button" aria-label="Desfazer" disabled></button>
      <button class="t-ico" id="btnRedo" type="button" aria-label="Refazer" disabled></button>
    </div>
  </section>

  <section class="timeline" id="timeline">
    <canvas class="ruler" id="ruler"></canvas>
    <div class="tc"><span id="tNow">0:00.0</span><span class="tc-sep">/</span><span id="tTotal">0:00.0</span></div>
    <div class="tracks" id="tracks"></div>
    <div class="needle" id="needle"></div>
    <div class="trim-tip hidden" id="trimTip"></div>
  </section>

  <nav class="toolbar" id="toolbar" aria-label="Ferramentas"></nav>
  <nav class="toolbar ctx hidden" id="ctxbar" aria-label="Ferramentas da tomada"></nav>

  <section class="empty hidden" id="empty">
    <div class="empty-card">
      <div class="empty-ico" id="emptyIco"></div>
      <h1 id="emptyTitle">Envie um vídeo</h1>
      <p id="emptyText">Escolha da galeria do celular. O corte começa assim que ele chegar.</p>
      <button class="tb-btn primary big" id="btnEmptyUpload" type="button">Escolher vídeo</button>
      <p class="empty-alt" id="emptyAlt">Ou peça no Claude ou no ChatGPT para editar um vídeo que já está no computador.</p>
    </div>
  </section>
</div>

<!-- painel que sobe de baixo: Estilo -->
<section class="sheet" id="sheet" aria-hidden="true">
  <!-- fechar à esquerda, abas no meio, aplicar à direita: tudo no alto, perto do vídeo -->
  <div class="sheet-head">
    <button class="sh-close" id="sheetClose" type="button" aria-label="Fechar sem aplicar"></button>
    <div class="sheet-tabs" id="sheetTabs" role="tablist"></div>
    <button class="tb-btn primary sh-apply" id="sheetApply" type="button">Aplicar</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-sum" id="sheetSum"></div>
</section>

<!-- painel pequeno: o que mudar no trecho marcado -->
<section class="sheet small" id="noteSheet" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="note-head"><b>O que mudar aqui?</b><span id="noteRange"></span></div>
  <textarea id="noteText" rows="3" placeholder="Ex.: tira essa pausa, troca a imagem, a legenda errou a palavra…"></textarea>
  <footer class="sheet-foot">
    <button class="tb-btn ghost danger hidden" id="noteDelete" type="button">Excluir</button>
    <div class="t-spacer"></div>
    <button class="tb-btn ghost" id="noteCancel" type="button">Cancelar</button>
    <button class="tb-btn primary" id="noteOk" type="button">Guardar</button>
  </footer>
</section>

<input type="file" id="fileInput" accept="video/*" hidden>
<!-- envio de vídeo: vai em pedaços para a pasta dos vídeos no computador -->
<section class="upload hidden" id="upload" role="status" aria-live="polite">
  <div class="up-row">
    <span class="up-ico" id="upIco"></span>
    <b class="up-name" id="upName"></b>
    <button class="tb-btn ghost" id="upCancel" type="button">Cancelar</button>
  </div>
  <div class="up-track"><div class="up-bar" id="upBar"></div></div>
  <div class="up-pct" id="upPct"></div>
</section>
<div class="toast hidden" id="toast" role="status"></div>
<script src="/assets/estilos.js"></script>
<script src="/assets/celular.js"></script>
</body>
</html>
